name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + testes + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (regras fatais)
        run: ruff check .
      - name: Run tests
        run: python -m pytest app/tests -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Bloqueante desde a demanda 002: a causa das falhas era o Next 16
    # bloquear /_next/* vindo de 127.0.0.1 (ver frontend/next.config.js).
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  android:
    name: Android (testes unitários)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/android-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O padrão da action instala o pacote 'tools', que não existe mais no
      # sdkmanager atual e derrubava o job. Só platform-tools é necessário aqui.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # O plugin google-services exige o arquivo mesmo para rodar testes.
      # Placeholder local, nunca commitado (ver BUILD_NOTES.md, seção 3).
      - name: Create google-services placeholder
        shell: bash
        working-directory: apps/android-companion
        run: |
          mkdir -p app/src/dev
          cat > app/src/dev/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "cyberalerta-ci-placeholder",
              "storage_bucket": "cyberalerta-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.cyberalerta.companion.dev"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "placeholder"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: apps/android-companion
        run: ./gradlew testDevDebugUnitTest --no-daemon --stacktrace
