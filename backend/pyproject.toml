[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv", "venv", "__pycache__"]

# Conjunto mínimo de propósito: só o que é bug de verdade (erro de sintaxe e
# nome indefinido). Regras de estilo entram depois, uma por PR — ligar tudo de
# uma vez transforma o CI em ruído e ninguém conserta.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
